<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LeadFlow V1</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #07111f; color: #e7eef7; }
    main { max-width: 1100px; margin: 0 auto; padding: 40px 20px 80px; }
    h1 { margin-bottom: 6px; font-size: clamp(2rem, 4vw, 3.4rem); }
    .muted { color: #91a4bb; }
    .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit,minmax(320px,1fr)); margin-top: 30px; }
    .card { background: #0d1b2c; border: 1px solid #1d3148; border-radius: 20px; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
    label { display: block; margin: 12px 0 6px; font-size: .9rem; color: #b8c7d9; }
    input, textarea { width: 100%; border: 1px solid #28425f; border-radius: 12px; background: #091625; color: white; padding: 11px 12px; }
    textarea { min-height: 92px; resize: vertical; }
    .checks { display: flex; gap: 18px; flex-wrap: wrap; margin: 16px 0; }
    .checks label { display: flex; gap: 8px; align-items: center; margin: 0; }
    .checks input { width: auto; }
    button { border: 0; border-radius: 12px; padding: 12px 16px; font-weight: 700; cursor: pointer; background: #36a6ff; color: #03111d; }
    button.secondary { background: #1b314a; color: #dce9f7; }
    .row { display:flex; gap:10px; flex-wrap:wrap; }
    .lead { border-top: 1px solid #20364e; padding: 16px 0; }
    .badge { display:inline-block; border-radius:999px; background:#142b43; padding:4px 9px; margin-right:6px; font-size:.78rem; }
    pre { white-space: pre-wrap; color: #b9d9f3; }
  </style>
</head>
<body>
<main>
  <p class="muted">PROJECT 6</p>
  <h1>LeadFlow V1</h1>
  <p class="muted">Intake → qualify → route → follow up → operator queue.</p>
  <div class="grid">
    <section class="card">
      <h2>Lead intake</h2>
      <form id="lead-form">
        <label>Name <input name="name" required minlength="2" /></label>
        <label>Email <input name="email" type="email" required /></label>
        <label>Phone <input name="phone" /></label>
        <label>Service <input name="service" required value="Automation consulting" /></label>
        <label>Source <input name="source" value="website" /></label>
        <label>Estimated value <input name="estimated_value" type="number" min="0" /></label>
        <label>Timeline in days <input name="timeline_days" type="number" min="1" /></label>
        <div class="checks">
          <label><input name="budget_confirmed" type="checkbox" /> Budget confirmed</label>
          <label><input name="decision_maker" type="checkbox" /> Decision maker</label>
          <label><input name="communication_consent" type="checkbox" /> Consent to follow up</label>
          <label><input name="opted_out" type="checkbox" /> Opted out</label>
        </div>
        <label>Notes <textarea name="notes"></textarea></label>
        <button type="submit">Qualify lead</button>
      </form>
      <pre id="result" aria-live="polite"></pre>
    </section>
    <section class="card">
      <div class="row" style="justify-content:space-between;align-items:center">
        <h2>Operator queue</h2>
        <button class="secondary" id="refresh" type="button">Refresh</button>
      </div>
      <label for="operator-token">Operator access token (only when enabled on the local server)</label>
      <input id="operator-token" type="password" autocomplete="off" spellcheck="false" placeholder="Enter token; never paste into a URL" />
      <div id="queue" class="muted">No leads loaded.</div>
      <p id="queue-status" class="muted" role="status" aria-live="polite">Queue not refreshed yet.</p>
    </section>
  </div>
</main>
<script>
const form = document.querySelector("#lead-form");
const result = document.querySelector("#result");
const queue = document.querySelector("#queue");
const queueStatus = document.querySelector("#queue-status");
const refreshButton = document.querySelector("#refresh");
const operatorToken = document.querySelector("#operator-token");
const submitButton = form.querySelector('button[type="submit"]');
let queueLoadPending = false;
let intakePending = false;
function escapeHtml(value) {
  return String(value).replace(/[&<>'"]/g, (character) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
  })[character]);
}
function payloadFromForm() {
  const data = new FormData(form);
  const num = (name) => data.get(name) ? Number(data.get(name)) : null;
  return {
    name: data.get("name"),
    email: data.get("email"),
    phone: data.get("phone") || null,
    source: data.get("source") || "website",
    service: data.get("service"),
    estimated_value: num("estimated_value"),
    timeline_days: num("timeline_days"),
    budget_confirmed: data.get("budget_confirmed") === "on",
    decision_maker: data.get("decision_maker") === "on",
    notes: data.get("notes") || null
    ,communication_consent: data.get("communication_consent") === "on"
    ,opted_out: data.get("opted_out") === "on"
  };
}
async function loadQueue() {
  if (queueLoadPending) return;
  queueLoadPending = true;
  refreshButton.disabled = true;
  refreshButton.textContent = "Refreshing…";
  queueStatus.textContent = "Refreshing operator queue…";
  try {
    const queueOptions = {cache: "no-store"};
    const token = operatorToken.value.trim();
    if (token) queueOptions.headers = {Authorization: `Bearer ${token}`};
    const response = await fetch("/api/leads", queueOptions);
    if (response.status === 401) {
      // Never retain stale PII from a prior authorized response after access fails.
      queue.replaceChildren();
      queueStatus.textContent = "Operator access required. Enter a valid token and refresh.";
      return;
    }
    if (!response.ok) throw new Error("Queue request failed");
    const leads = await response.json();
    if (!Array.isArray(leads)) throw new Error("Unexpected queue response");
    if (!leads.length) {
      queue.innerHTML = '<p class="muted">No leads yet.</p>';
      queueStatus.textContent = "Queue refreshed. No leads yet.";
      return;
    }
    queue.innerHTML = leads.map(item => `
    <article class="lead">
      <strong>${escapeHtml(item.lead.name)}</strong> · ${escapeHtml(item.lead.service)}<br/>
      <span class="badge">${escapeHtml(item.qualification.score)}/100</span>
      <span class="badge">${escapeHtml(item.qualification.routing)}</span>
      <span class="badge">${escapeHtml(item.qualification.priority)}</span>
      <p><strong>Next:</strong> ${escapeHtml(item.qualification.next_action)}</p>
      <p><strong>Communication:</strong> ${escapeHtml(item.communication_status)}<br/>
      <strong>Scheduling:</strong> ${escapeHtml(item.scheduling_status)}</p>
      <p class="muted">${escapeHtml(item.follow_up)}</p>
    </article>`).join("");
    queueStatus.textContent = `Queue refreshed: ${leads.length} lead${leads.length === 1 ? "" : "s"} loaded.`;
  } catch {
    // Keep the previous queue contents rather than replacing them with an error.
    queueStatus.textContent = "Unable to refresh queue. Check the local server and try again.";
  } finally {
    queueLoadPending = false;
    refreshButton.disabled = false;
    refreshButton.textContent = "Refresh";
  }
}
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  if (intakePending) return;
  intakePending = true;
  submitButton.disabled = true;
  submitButton.textContent = "Qualifying…";
  result.textContent = "Processing…";
  try {
    const response = await fetch("/api/leads", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payloadFromForm())
    });
    if (!response.ok) {
      result.textContent = `Unable to qualify lead (HTTP ${response.status}). Review the form and try again.`;
      return;
    }
    const data = await response.json();
    if (!data || !data.qualification || typeof data.qualification.score !== "number") {
      throw new Error("Unexpected intake response");
    }
    result.textContent = `Score: ${data.qualification.score}/100
Route: ${data.qualification.routing}
Priority: ${data.qualification.priority}
Next action: ${data.qualification.next_action}
Communication: ${data.communication_status}
Scheduling: ${data.scheduling_status}

Follow-up:
${data.follow_up}`;
    await loadQueue();
  } catch {
    result.textContent = "Unable to qualify lead. Check the local server and try again. No delivery was attempted.";
  } finally {
    intakePending = false;
    submitButton.disabled = false;
    submitButton.textContent = "Qualify lead";
  }
});
refreshButton.addEventListener("click", loadQueue);
loadQueue();
</script>
</body>
</html>
