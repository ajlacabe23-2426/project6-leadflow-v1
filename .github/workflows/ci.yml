name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Scan reachable Git history for credential material
        run: python scripts/security/scan_git_history.py

      - name: Validate repository security baseline
        run: python scripts/security/check_repository_baseline.py

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Audit Python dependency advisories
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit -r requirements.txt

      - name: Show environment
        run: |
          python --version
          python -m pip --version

      - name: Compile Python sources
        run: python -m compileall -q app tests scripts

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run tests
        run: python -m pytest -q

      - name: Run demo smoke test
        env:
          LEADFLOW_DB_PATH: /tmp/leadflow-demo.db
        run: python -m scripts.demo

      - name: Build Docker image
        run: docker build -t leadflow-v1:ci .
