name: Security monitor

on:
  pull_request:
  push:
  schedule:
    - cron: "41 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-monitor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-security:
    name: Repository security
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Scan reachable history for credential material
        run: python scripts/security/scan_git_history.py
      - name: Validate repository security baseline
        run: python scripts/security/check_repository_baseline.py
      - name: Audit Python dependency advisories
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit -r requirements.txt
